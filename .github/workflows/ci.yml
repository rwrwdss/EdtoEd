name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edtoed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: edtoed/go.mod
          cache-dependency-path: edtoed/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './api/proto/*'))"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install inference runtime
        run: pip install onnxruntime==1.22.1 numpy==2.2.6
      - name: Test
        run: TEST_ONNX=1 go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/server

  docker:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f edtoed/Dockerfile edtoed
