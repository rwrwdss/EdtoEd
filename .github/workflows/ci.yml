name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edtoed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: edtoed/go.mod
          cache-dependency-path: edtoed/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './api/proto/*'))"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/server

  docker:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f edtoed/Dockerfile edtoed
